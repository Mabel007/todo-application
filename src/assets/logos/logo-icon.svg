# Todo Application

A modern task management application built with **React**, **TypeScript**, **Vite**, and **ShadCN/UI**.

This project serves as both an **AltSchool Frontend Engineering Capstone Project** and a **professional portfolio** demonstrating modern frontend development, quality assurance, documentation, and deployment best practices.

---

## 📖 Project Overview

Todo Application is built using a scalable architecture that emphasizes:

- Maintainability
- Accessibility (WCAG 2.1 AA)
- Code Quality
- Developer Experience
- Performance
- Responsive Design

The project follows an industry-standard software development lifecycle using:

- Jira
- Confluence
- GitHub
- GitHub Actions
- CodeRabbit
- Vercel

Comprehensive project documentation is available in the `docs/` directory.

---

## 🚀 Tech Stack

### Frontend

- React 19
- TypeScript
- Vite
- Tailwind CSS v4
- ShadCN/UI

### Code Quality

- ESLint
- Prettier
- Husky
- lint-staged
- CodeRabbit

### CI/CD

- GitHub Actions
- Vercel

### Testing

- Manual Testing
- Playwright *(Planned)*
- React Testing Library *(Planned)*
- Vitest *(Planned)*

### Project Management

- Jira
- Confluence

---

## 📦 Getting Started

### Prerequisites

- Node.js 22+
- npm 10+

### Clone the Repository

```bash
git clone https://github.com/Mabel007/todo-application.git

cd todo-application
```

### Install Dependencies

```bash
npm install
```

### Start the Development Server

```bash
npm run dev
```

The application will be available at:

```text
http://localhost:5173
```

### Build for Production

```bash
npm run build
```

---

## 📜 Available Scripts

| Command | Description |
|----------|-------------|
| `npm run dev` | Start the Vite development server |
| `npm run build` | Build the application for production |
| `npm run lint` | Run ESLint |
| `npm run lint:fix` | Automatically fix linting issues |
| `npm run format` | Format all supported files using Prettier |
| `npm run format:check` | Check formatting without making changes |

---

## 📚 Documentation

Project documentation is organized under the `docs/` directory and includes:

- Project Overview
- Environment Setup
- Development Workflow
- Project Structure
- Coding Standards
- Git Workflow
- Testing Strategy
- Deployment Guide
- Accessibility Checklist
- Release Notes
- Contribution Guidelines

---

## 🔄 Continuous Integration

GitHub Actions automatically:

- Installs dependencies
- Runs ESLint
- Builds the application

Every Pull Request must pass the CI workflow before it can be merged.

---

## ✅ Definition of Done

A Jira ticket is considered complete only when:

- Acceptance Criteria are met
- ESLint passes
- Prettier formatting passes
- Production build succeeds
- Manual testing is completed
- CodeRabbit review is completed
- Pull Request is approved
- Branch is merged into `dev`
- Jira ticket is updated
- Documentation is updated (where applicable)

