All of those tags belong inside the <head> section of your index.html file.

For a Vite project, that's typically:

todo-application/
├── index.html
├── src/
└── ...
So your index.html should look like:

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="A modern task management application built with React, TypeScript, and Vite."
    />

    <meta
      name="theme-color"
      content="#2563eb"
    />

    <meta
      property="og:title"
      content="Todo Application"
    />

    <meta
      property="og:description"
      content="A modern task management application."
    />

    <title>Todo Application</title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
What each tag does
Favicon
<link
  rel="icon"
  href="/favicon.svg"
/>
Displayed in:

Browser tab

Bookmarks

Browser history

Description
<meta
  name="description"
  content="..."
/>
Used by:

Google Search

Bing

SEO tools

It may appear as the snippet beneath your page title in search results.

Theme Color
<meta
  name="theme-color"
  content="#2563eb"
/>
This tells supported browsers what color to use for the browser UI associated with your site.

You'll notice it most in:

Android Chrome: the browser toolbar/address bar often changes to this color.

Installed PWAs: the app's title bar and splash screen use it.

Some mobile browsers use it for the browser chrome.

On desktop Chrome, you usually won't see any obvious change while browsing a normal website.

How to verify it
Open your app in Chrome on Android (or use device emulation in Chrome DevTools).

Open Developer Tools → Elements.

Inspect the <head> and confirm the tag is present.

If you later make your app installable as a PWA, you'll see the theme color reflected in the installed app's UI.

Open Graph Tags
<meta property="og:title" ... />
<meta property="og:description" ... />
These are used when someone shares your site on platforms like:

LinkedIn

Facebook

Slack

Discord

Microsoft Teams

Without them, those platforms have to guess the page title and description.

You'll likely add more later, such as:

<meta property="og:image" content="..." />
<meta property="og:url" content="..." />
once your site is deployed.

How to inspect these tags
Open your app, then:

Press F12 (or Ctrl + Shift + I).

Go to the Elements tab.

Expand the <head> element.

You'll see:

<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#2563eb">
  ...
</head>
This confirms the browser has loaded the metadata.

For your Todo Application
For Epic 1, this setup is sufficient. Once you deploy to Vercel in a later epic, I'd enhance the metadata with:

og:image

og:url

twitter:card

twitter:title

twitter:description

twitter:image

That will give your portfolio project rich previews when shared on social media or messaging platforms.


