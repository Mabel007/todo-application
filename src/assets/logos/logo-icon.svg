The error is actually telling you exactly what's wrong.

Can't resolve '@styles/topography.css'
But all your other imports use:

@import "@/styles/reset.css";
@import "@/styles/tokens.css";
@import "@/styles/theme.css";
@import "@/styles/utilities.css";
Notice the difference?

@import "@styles/topography.css";
uses @styles, which is not an alias in your project.

Fix
If topography.css is inside:

src/
└── styles/
    └── topography.css
then change:

@import "@styles/topography.css";
to:

@import "@/styles/topography.css";
Also check the filename
You wrote:

topography.css

Is the file actually named:

topography.css
or

typography.css
The contents:

h1,
h2,
h3,
h4,
h5,
h6 {
  font-family: var(--font-heading);
}

body,
button,
input,
textarea,
select {
  font-family: var(--font-body);
}
look like typography styles, not topography.

If the file on disk is:

src/styles/typography.css
then your import should be:

@import "@/styles/typography.css";
Verify your project
Your structure should look like:

src
├── styles
│   ├── reset.css
│   ├── tokens.css
│   ├── theme.css
│   ├── typography.css   ← or topography.css if that is intentional
│   └── utilities.css
My guess
From the error and the naming, I'm about 99% sure the issue is one of these:

❌ @styles should be @/styles

❌ The file is named typography.css, but you're importing topography.css

Can you paste the output of:

src/
└── styles/
(or a screenshot of the src/styles folder)? That will immediately confirm which of the two it is.


