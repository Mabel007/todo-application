Now that TA-5 is complete, your workflow becomes much simpler. The goal is to let ESLint, Prettier, Husky, and lint-staged do their jobs automatically.

Daily Development Workflow
1. Start your work
git checkout dev
git pull origin dev
git checkout -b feature/TA-XX-description
2. Implement the ticket
Work on only the files required for that Jira ticket.

3. Before staging (recommended)
Run:

npm run lint
If there are issues:

npm run lint:fix
Then:

npm run format
If you only edited a few files, you can also format just those files instead of the entire project:

npx prettier src/components/Button.tsx --write
or

npx prettier src/pages/Home.tsx src/components/Navbar.tsx --write
4. Verify the project builds
npm run build
This catches TypeScript and production build issues.

5. Manual testing
Run the application:

npm run dev
Verify the ticket meets its acceptance criteria.

6. Stage your changes
git add .
or stage specific files if you prefer.

7. Commit
git commit -m "feat(TA-6): implement application layout"
At this point Husky automatically runs:

lint-staged
├── ESLint --fix
└── Prettier --write
Only staged files are checked and formatted.

If Husky finds an error, the commit is blocked. Fix the issue, stage the updated files again, and retry the commit.

8. Push
git push -u origin feature/TA-6-application-layout
What you should not do anymore
❌ You no longer need to:

git restore .
or

npm run format
just to undo formatting changes across the repository. Since TA-5 established the formatting baseline, only files you modify should be affected.

Before every Pull Request
I recommend running one final verification:

npm run lint
npm run build
If both succeed and you've manually tested the feature, you're ready to create the PR.

My recommended workflow for your Todo Application
For every Jira ticket, follow this sequence:

Checkout dev
↓
Create feature branch
↓
Implement ticket
↓
npm run lint
↓
npm run lint:fix (if needed)
↓
npm run build
↓
Manual testing
↓
git add .
↓
git commit
(Husky + lint-staged run automatically)
↓
git push
↓
Create PR
↓
CodeRabbit review
↓
QA validation
↓
Merge into dev
This aligns well with the development workflow you've defined for the project and is a common practice in professional React and TypeScript teams.


