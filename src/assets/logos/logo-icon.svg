If the design is complex
If it's a simple or moderately detailed vector logo, I can recreate it by hand.

If it's an extremely detailed illustration with hundreds of paths (like an Adobe Illustrator export), I can either:

recreate it as a clean simplified vector, or

recreate the important elements while keeping the visual style.

